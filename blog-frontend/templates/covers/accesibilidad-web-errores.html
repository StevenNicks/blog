<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0b0d;font-family:"DejaVu Sans",Arial,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;width:700px;height:700px;right:-150px;top:-120px;background:radial-gradient(circle,#8bd44a33,transparent 65%)}
.left{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:560px}
.tag{display:inline-block;color:#8bd44a;border:2px solid #8bd44a55;background:#8bd44a14;padding:8px 18px;border-radius:999px;font-size:22px;font-weight:bold;letter-spacing:2px;margin-bottom:28px;width:fit-content}
h1{color:#f5f5f5;font-size:62px;line-height:1.1;font-weight:bold}
h1 span{color:#8bd44a}
.term{margin-top:36px;background:#18181b;border:1px solid #2a2a2e;border-radius:12px;padding:18px 22px;font-family:"DejaVu Sans Mono",monospace;font-size:22px;color:#d4d4d8;width:fit-content}
.term b{color:#8bd44a}
.stack{position:absolute;right:110px;top:110px;width:400px;height:410px}
.win{position:absolute;left:0;top:0;width:400px;height:410px;border-radius:14px;border:3px solid #8bd44a;background:linear-gradient(160deg,#1f2a17,#141414);box-shadow:0 20px 40px #0008}
.hd{position:absolute;left:0;right:0;top:0;height:62px;border-bottom:3px solid #8bd44a55}
.dot{position:absolute;top:20px;width:18px;height:18px;border-radius:50%;background:#8bd44a}
.bar{position:absolute;height:14px;border-radius:7px;background:#3f3f46}
.eye{position:absolute;left:26px;top:150px;width:110px;height:110px;border-radius:50%;border:3px solid #8bd44a;background:#8bd44a22}
.eye::after{content:"";position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:#8bd44a}
.sw{position:absolute;top:150px;width:110px;height:110px;border-radius:14px}
.btn{position:absolute;left:26px;top:296px;width:170px;height:62px;border-radius:12px;background:#8bd44a}
.ring{position:absolute;left:16px;top:286px;width:190px;height:82px;border-radius:18px;border:3px dashed #8bd44a}
.btn2{position:absolute;left:226px;top:296px;width:148px;height:62px;border-radius:12px;border:3px solid #3f3f46;background:#18181b}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="left">
  <div class="tag">DISEÑO</div>
  <h1>Accesibilidad<br>web: errores<br><span>sin darnos cuenta</span></h1>
  <div class="term"><b>&lt;</b>img src="a.png" <b>alt=""</b>&gt;</div>
</div>
<div class="stack">
  <div class="win">
    <div class="hd"></div><div class="dot" style="left:28px"></div><div class="dot" style="left:60px;opacity:.5"></div>
    <div class="bar" style="left:26px;top:92px;width:240px;background:#8bd44a"></div>
    <div class="bar" style="left:26px;top:122px;width:170px"></div>
    <div class="eye" style="left:26px"></div>
    <div class="sw" style="left:156px;background:#8bd44a;border:3px solid #8bd44a"></div>
    <div class="sw" style="left:274px;width:100px;background:#1f2a17;border:3px solid #2a3a1f"></div>
    <div class="ring"></div><div class="btn"></div><div class="btn2"></div>
  </div>
</div>
</body></html>
